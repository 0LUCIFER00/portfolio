<section class="profile-section">
  <div class="profile-card">
    <h2>🎓 Certificates</h2>
    <ul>
      <li *ngFor="let cert of certificates">{{ cert }}</li>
    </ul>
  </div>

  <div class="profile-card">
    <h2>💡 Soft Skills</h2>
    <ul>
      <li *ngFor="let skill of softSkills">{{ skill }}</li>
    </ul>
  </div>

  <div class="profile-card">
    <h2>🎯 Hobbies</h2>
    <ul>
      <li *ngFor="let hobby of hobbies">{{ hobby }}</li>
    </ul>
  </div>
</section>
